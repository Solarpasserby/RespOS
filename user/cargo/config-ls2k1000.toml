[build]
target = "loongarch64-unknown-none"

[target.loongarch64-unknown-none]
rustflags = [
    "-Clink-arg=-Tsrc/linker_loongarch.ld",
    "-Cforce-frame-pointers=yes",
    # Match the LA264 kernel ABI/code-generation constraint on real hardware.
    "-Ctarget-feature=-lsx,-lasx,-ual",
]

[profile.dev]
panic = "abort"

[profile.release]
debug = false
panic = "abort"

[profile.release-debug]
inherits = "release"
debug = true
