<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500">
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4 0 8Z" fill="#667085"/></marker><style>.t{font:700 23px sans-serif;fill:#202124}.s{font:16px sans-serif;fill:#475467}.m{font:16px monospace;fill:#344054}.ar{stroke:#667085;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1000" height="500" fill="#fff"/>
  <rect x="270" y="25" width="460" height="60" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="500" y="62" text-anchor="middle" class="t">用户 fd 与文件系统调用</text><line x1="500" y1="85" x2="500" y2="122" class="ar"/>
  <rect x="90" y="122" width="820" height="75" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="500" y="151" text-anchor="middle" class="t">VFS 对象层</text><text x="500" y="180" text-anchor="middle" class="m">FdTable → FileOp → Path / Dentry → InodeOp → SuperBlockOp</text>
  <line x1="260" y1="197" x2="200" y2="250" class="ar"/><line x1="500" y1="197" x2="500" y2="250" class="ar"/><line x1="740" y1="197" x2="800" y2="250" class="ar"/>
  <rect x="55" y="250" width="290" height="105" rx="10" fill="#ecfdf3" stroke="#16a34a" stroke-width="2"/><text x="200" y="285" text-anchor="middle" class="t">持久化后端</text><text x="200" y="316" text-anchor="middle" class="m">PageCache → Ext4 → Disk</text><text x="200" y="340" text-anchor="middle" class="s">普通文件、目录、链接</text>
  <rect x="365" y="250" width="270" height="105" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="500" y="285" text-anchor="middle" class="t">虚拟文件系统</text><text x="500" y="316" text-anchor="middle" class="m">procfs / devfs</text><text x="500" y="340" text-anchor="middle" class="s">按内核状态动态生成</text>
  <rect x="655" y="250" width="290" height="105" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="800" y="285" text-anchor="middle" class="t">无路径特殊对象</text><text x="800" y="316" text-anchor="middle" class="m">pipe / socket / timerfd</text><text x="800" y="340" text-anchor="middle" class="s">复用 FileOp、poll 和 close</text>
  <rect x="95" y="410" width="810" height="55" rx="9" fill="#fff" stroke="#d0d5dd" stroke-width="1.5"/><text x="500" y="444" text-anchor="middle" class="s">路径与对象身份、打开状态、后端存储分离，多种文件类型共享统一 fd 生命周期。</text>
</svg>
