[package]
name = "RespOS"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[features]
log = []
verbose_boot = []
perf_counters = ["respos_buddy_allocator/perf_counters"]
heap_magazine = []
debug_traces = []
fault_trace = []
la_global_kernel = []

[[bin]]
name = "os"
path = "src/main.rs"

[dependencies]
lazy_static = { version = "1.4.0", features = ["spin_no_std"] }
respos_buddy_allocator = { path = "../vendor/respos_buddy_allocator" }
bitflags = "1.2.1"
xmas-elf = "0.7.0"
virtio-drivers = { version = "0.11.0", features = ["alloc"] }
spin = "0.9.8"
smoltcp = { path = "../vendor/smoltcp", default-features = false, features = ["alloc", "log", "medium-ethernet", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp"] }
hashbrown = "0.16.1"
lwext4_rust = { path = "../vendor/lwext4_rust", default-features = false }

[target.'cfg(target_arch = "riscv64")'.dependencies]
riscv = { path = "../vendor/riscv", features = ["inline-asm"] }
sbi-rt = { version = "0.0.3", features = ["legacy"] }
