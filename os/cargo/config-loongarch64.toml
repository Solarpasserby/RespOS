[build]
target = "loongarch64-unknown-none"

[target.loongarch64-unknown-none]
rustflags = [
    "-Clink-arg=-Tsrc/linker_loongarch.ld",
    "-Cforce-frame-pointers=yes",
    "-Ctarget-feature=-lsx,-lasx",
]

[profile.dev]
panic = "abort"

[profile.release]
debug = false
# Keep the submission profile identical across architectures.  In particular,
# avoid the platform rustc 1.86 thin-LTO code-generation failure seen on RV64.
lto = false
panic = "abort"

[profile.release-debug]
inherits = "release"
debug = true
