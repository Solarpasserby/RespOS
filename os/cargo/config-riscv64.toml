[build]
target = "riscv64gc-unknown-none-elf"

[target.riscv64gc-unknown-none-elf]
rustflags = [
    "-Clink-arg=-Tsrc/linker_riscv.ld",
    "-Cforce-frame-pointers=yes",
    "-Ctarget-feature=+f,+d",
]

[profile.dev]
panic = "abort"

[profile.release]
debug = false
# The contest platform uses rustc 1.86 nightly.  Its RV64 thin-LTO output
# reproducibly corrupts dynamic-program execution; the same sources without
# LTO pass CAgent and the BuildStorm toolchain/minibuild gate.
lto = false
panic = "abort"

[profile.release-debug]
inherits = "release"
debug = true
