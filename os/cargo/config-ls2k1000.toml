[build]
target = "loongarch64-unknown-none"

[target.loongarch64-unknown-none]
rustflags = [
    "-Clink-arg=-Tsrc/linker_loongarch.ld",
    "-Cforce-frame-pointers=yes",
    # LA264 reports CPUCFG1.UAL=0. Force byte-wise lowering for potentially
    # unaligned accesses instead of leaking this board constraint into QEMU.
    "-Ctarget-feature=-lsx,-lasx,-ual",
]

[profile.dev]
panic = "abort"

[profile.release]
debug = false
lto = false
panic = "abort"

[profile.release-debug]
inherits = "release"
debug = true
